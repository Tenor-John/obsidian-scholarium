name: Publish audited Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref_name != '3.0.1'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install locked dependencies and build release assets
        run: |
          npm ci
          npm run build:release
          npm test

      - name: Verify frozen plugin assets
        run: |
          node --check main.js
          node --test tests/release-hygiene.test.js

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
