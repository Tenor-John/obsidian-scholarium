name: Publish audited Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # 3.0.1 is published from the fixed acceptance artifact with a corrected manifest.
    # The repository-root bundle is not byte-identical to that artifact.
    if: github.ref_name != '3.0.1'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Verify frozen plugin assets
        run: |
          node --check main.js
          node --test tests/release-hygiene.test.js

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            main.js
            manifest.json
            styles.css
